<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Upload Files — CamHost.space</title>
  <meta name="robots" content="noindex"/>
  <link rel="stylesheet" href="_app.css"/>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <nav class="breadcrumb">
          <a href="index.html" style="color:var(--text-muted);text-decoration:none">Home</a>
          <span class="breadcrumb-sep">/</span>
          <span class="breadcrumb-current">Upload Files</span>
        </nav>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="theme-btn" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <main class="page">
      <div class="page-header">
        <div class="page-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload Files
        </div>
        <div class="page-actions">
          <!-- Folder selector -->
          <select class="form-input form-select" id="folder-select" style="width:auto;padding:7px 14px;height:36px">
            <option value="">📂 No Folder (root)</option>
          </select>
        </div>
      </div>

      <!-- Drop Zone -->
      <div class="upload-zone" id="drop-zone">
        <input type="file" id="file-input" multiple/>
        <div class="upload-zone-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="30" height="30"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="upload-zone-title">Drop files here or click to browse</div>
        <div class="upload-zone-sub">Any file type · Up to 2 GB per file (requires Telegram Local Bot API) · Multiple files supported</div>
        <button type="button" class="btn btn-primary" style="margin-top:16px" onclick="document.getElementById('file-input').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Choose Files
        </button>
      </div>

      <!-- Progress List -->
      <div class="progress-list" id="progress-list"></div>

      <!-- Results -->
      <div id="results"></div>
    </main>
  </div>
</div>

<script src="_app.js"></script>
<script>
let uploading = false;

async function init() {
  const user = await requireAuth();
  renderSidebar('upload');
  initSidebar('upload');
  initCanvas();
  fillUserBadge(user);
  await loadFolders();
  bindZone();
}

async function loadFolders() {
  try {
    const res = await apiRequest('/folders');
    const sel = document.getElementById('folder-select');
    (res.folders||[]).forEach(f=>{
      const o = document.createElement('option');
      o.value = f.id; o.textContent = '📂 '+f.name;
      sel.appendChild(o);
    });
  } catch{}
}

function bindZone() {
  const zone  = document.getElementById('drop-zone');
  const input = document.getElementById('file-input');
  zone.addEventListener('click', e=>{ if(e.target===zone||e.target.closest('.upload-zone-icon')||e.target.tagName==='DIV') input.click(); });
  zone.addEventListener('dragover',  e=>{ e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
  input.addEventListener('change', ()=>handleFiles(input.files));
}

function handleFiles(fileList) {
  if(!fileList.length) return;
  Array.from(fileList).forEach(uploadFile);
}

function uploadFile(file) {
  const progList = document.getElementById('progress-list');
  const id = 'prog-'+Date.now()+'-'+Math.random().toString(36).slice(2);

  const item = document.createElement('div');
  item.className = 'progress-item';
  item.id = id;
  const {emoji} = mimeIcon(file.type);
  item.innerHTML = `
    <div class="progress-row">
      <span style="font-size:1.1rem">${emoji}</span>
      <span class="progress-name">${esc(file.name)}</span>
      <span class="progress-pct" id="${id}-pct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="${id}-fill"></div></div>
    <div style="font-size:.72rem;color:var(--text-muted);margin-top:5px" id="${id}-status">${formatBytes(file.size)} · Uploading…</div>`;
  progList.appendChild(item);

  const fd = new FormData();
  fd.append('file', file);
  const fid = document.getElementById('folder-select').value;
  if(fid) fd.append('folder_id', fid);

  apiUpload('/upload', fd, pct => {
    document.getElementById(id+'-pct').textContent = pct+'%';
    document.getElementById(id+'-fill').style.width = pct+'%';
  }).then(res => {
    document.getElementById(id+'-pct').textContent = '✓';
    document.getElementById(id+'-fill').classList.add('done');
    document.getElementById(id+'-fill').style.width = '100%';
    document.getElementById(id+'-status').textContent = '✓ Uploaded · '+formatBytes(file.size);
    document.getElementById(id+'-status').style.color = 'var(--green)';
    showToast('Uploaded: '+file.name, 'success');
  }).catch(err => {
    document.getElementById(id+'-pct').textContent = '✗';
    document.getElementById(id+'-fill').classList.add('error');
    document.getElementById(id+'-fill').style.width = '100%';
    document.getElementById(id+'-status').textContent = '✗ '+err.message;
    document.getElementById(id+'-status').style.color = '#ff6b6b';
    showToast('Failed: '+file.name+' — '+err.message,'error');
  });
}

init();
</script>
</body>
</html>
