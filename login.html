<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — CamHost.space</title>
  <meta name="robots" content="noindex"/>
  <link rel="stylesheet" href="_app.css"/>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .auth-wrap{width:100%;max-width:400px;animation:fadeUp .5s ease both}
    .auth-card{background:var(--surface-card);border:1px solid var(--border);border-radius:24px;padding:36px;backdrop-filter:blur(24px);box-shadow:0 24px 64px var(--shadow),0 0 0 1px var(--border-glow)}
    .auth-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px}
    .auth-logo-icon{width:42px;height:42px;background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(123,79,255,.1));border:1px solid var(--border-glow);border-radius:12px;display:flex;align-items:center;justify-content:center}
    .auth-logo-name{font-size:1.2rem;font-weight:700}
    .auth-title{font-size:1.45rem;font-weight:800;text-align:center;margin-bottom:4px}
    .auth-sub{color:var(--text-muted);font-size:.875rem;text-align:center;margin-bottom:26px}
    .auth-error{margin-top:12px;background:rgba(255,77,77,.1);border:1px solid rgba(255,77,77,.22);border-radius:10px;padding:10px 14px;color:#ff6b6b;font-size:.84rem;text-align:center;display:none}
    .auth-error.show{display:block}
    .auth-footer{text-align:center;margin-top:20px;font-size:.84rem;color:var(--text-muted)}
    .auth-footer a{color:var(--cyan);text-decoration:none;font-weight:600}
    .auth-footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 40 40" fill="none" width="24" height="24">
          <path d="M20 5C12.268 5 6 11.268 6 19c0 4.418 2.015 8.374 5.195 11H8a1 1 0 000 2h24a1 1 0 000-2h-3.195C31.985 27.374 34 23.418 34 19c0-7.732-6.268-14-14-14z" fill="url(#lg)"/>
          <path d="M26.5 16.5L18 20l-4-1.5 12.5-4.5v2.5z" fill="white" opacity=".95"/>
          <path d="M18 20l2 5-2-2-1-3z" fill="white" opacity=".8"/>
          <defs><linearGradient id="lg" x1="6" y1="5" x2="34" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#00d4ff"/><stop offset="1" stop-color="#0077ff"/></linearGradient></defs>
        </svg>
      </div>
      <span class="auth-logo-name">CamHost<span style="color:var(--cyan)">.space</span></span>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to access your cloud files</p>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <div class="auth-error" id="auth-error"></div>
      <button type="submit" class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center;margin-top:6px;padding:13px">
        Sign In
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one →</a>
    </div>
  </div>
</div>

<script src="_app.js"></script>
<script>
(function(){
  // Redirect if already logged in
  const t = localStorage.getItem('ch-token');
  if(t) {
    apiRequest('/auth/me').then(()=>location.href='files.html').catch(()=>{
      localStorage.removeItem('ch-token');
    });
  }

  initCanvas();

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn  = document.getElementById('login-btn');
    const errEl= document.getElementById('auth-error');
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="17" height="17"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Signing in…';
    try {
      const res = await apiRequest('/auth/login', {
        method: 'POST',
        body: { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value }
      });
      localStorage.setItem('ch-token', res.token);
      localStorage.setItem('ch-user',  JSON.stringify(res.user));
      location.href = 'files.html';
    } catch(err) {
      errEl.textContent = err.message;
      errEl.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = 'Sign In <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    }
  });
})();
</script>
</body>
</html>
