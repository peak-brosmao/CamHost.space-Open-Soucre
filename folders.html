<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>My Folders — CamHost.space</title>
  <meta name="robots" content="noindex"/>
  <link rel="stylesheet" href="_app.css"/>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <nav class="breadcrumb" id="breadcrumb">
          <a href="index.html" style="color:var(--text-muted);text-decoration:none">Home</a>
          <span class="breadcrumb-sep">/</span>
          <span class="breadcrumb-current">My Folders</span>
        </nav>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="theme-btn" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <main class="page">
      <div class="page-header">
        <div class="page-title" id="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          My Folders
        </div>
        <div class="page-actions">
          <button class="btn btn-primary btn-sm" id="new-folder-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Folder
          </button>
        </div>
      </div>

      <!-- Folder grid -->
      <div id="folder-grid-container"></div>

      <!-- Folder files section -->
      <div id="folder-files-section" style="display:none">
        <div class="page-header" style="margin-top:20px">
          <div class="page-title" style="font-size:1rem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
            Files in <span id="folder-name-label" style="color:var(--cyan)"></span>
          </div>
        </div>
        <div id="folder-files-container"></div>
      </div>
    </main>
  </div>
</div>

<!-- New Folder Modal -->
<div class="modal-overlay" id="new-folder-modal">
  <div class="modal">
    <div class="modal-icon info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
    </div>
    <div class="modal-title">Create New Folder</div>
    <div class="modal-sub">Give your folder a name to organise your files.</div>
    <div class="form-group"><input type="text" id="new-folder-input" class="form-input" placeholder="Folder name…" maxlength="100"/></div>
    <div class="modal-actions">
      <button class="btn btn-ghost"    id="new-folder-cancel">Cancel</button>
      <button class="btn btn-primary"  id="new-folder-ok">Create</button>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div class="modal-overlay" id="rename-modal">
  <div class="modal">
    <div class="modal-icon info" style="background:rgba(123,79,255,.12);border-color:rgba(123,79,255,.3);color:var(--purple)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </div>
    <div class="modal-title">Rename Folder</div>
    <div class="form-group"><input type="text" id="rename-input" class="form-input" placeholder="New name…" maxlength="100"/></div>
    <div class="modal-actions">
      <button class="btn btn-ghost"   id="rename-cancel">Cancel</button>
      <button class="btn btn-purple"  id="rename-ok">Rename</button>
    </div>
  </div>
</div>

<!-- Confirm Delete -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-icon danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></div>
    <div class="modal-title" id="confirm-title">Delete Folder?</div>
    <div class="modal-sub"   id="confirm-sub">Files in this folder will be moved to root.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost"   id="confirm-cancel">Cancel</button>
      <button class="btn btn-danger"  id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<script src="_app.js"></script>
<script>
let folders = [], openFolderId = null, renameFolderId = null;

async function init() {
  const user = await requireAuth();
  renderSidebar('folders');
  initSidebar('folders');
  initCanvas();
  fillUserBadge(user);
  await loadFolders();
  bindNewFolder();
}

async function loadFolders() {
  const con = document.getElementById('folder-grid-container');
  con.innerHTML = '<div style="display:flex;gap:14px;flex-wrap:wrap">' + Array.from({length:6},()=>'<div class="skeleton" style="height:140px;border-radius:14px;flex:1 1 160px"></div>').join('') + '</div>';
  try {
    const res = await apiRequest('/folders');
    folders = res.folders || [];
    renderFolders();
  } catch(e) { con.innerHTML = `<div class="empty-state"><div class="empty-title">Failed to load folders</div><div class="empty-sub">${esc(e.message)}</div></div>`; }
}

function renderFolders() {
  const con = document.getElementById('folder-grid-container');
  if(!folders.length) {
    con.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div><div class="empty-title">No folders yet</div><div class="empty-sub">Create a folder to organize your files</div><br/><button class="btn btn-primary" onclick="openNewFolderModal()">Create Folder</button></div>`;
    return;
  }
  con.innerHTML = `<div class="folder-grid">${folders.map(folderCard).join('')}</div>`;
}

function folderCard(f) {
  return `<div class="folder-card" onclick="openFolder(${f.id},'${esc(f.name)}')">
    <div class="folder-icon">📂</div>
    <div class="folder-name" title="${esc(f.name)}">${esc(f.name)}</div>
    <div class="folder-meta">${f.file_count} file${f.file_count!==1?'s':''} · ${formatBytes(f.total_bytes)}</div>
    <div class="folder-actions" onclick="event.stopPropagation()">
      <button class="action-btn edit" onclick="openRename(${f.id},'${esc(f.name)}')" title="Rename">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="action-btn del" onclick="confirmDeleteFolder(${f.id},'${esc(f.name)}')" title="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
      </button>
    </div>
  </div>`;
}

async function openFolder(id, name) {
  openFolderId = id;
  document.getElementById('folder-name-label').textContent = name;
  document.getElementById('folder-files-section').style.display = '';
  const con = document.getElementById('folder-files-container');
  con.innerHTML = '<div style="color:var(--text-muted);padding:16px 0">Loading…</div>';
  try {
    const res = await apiRequest('/files?folder_id='+id);
    const files = res.files || [];
    if(!files.length) {
      con.innerHTML = `<div class="empty-state" style="padding:30px"><div class="empty-title">This folder is empty</div><div class="empty-sub">Move files here from My Files</div></div>`;
    } else {
      con.innerHTML = `<div class="table-wrap"><table class="file-list-table"><thead><tr><th>File</th><th>Size</th><th>Uploaded</th><th>Actions</th></tr></thead><tbody>${files.map(folderFileRow).join('')}</tbody></table></div>`;
    }
  } catch(e) { con.innerHTML = `<div class="empty-state"><div class="empty-title">Error: ${esc(e.message)}</div></div>`; }
}

function folderFileRow(f) {
  const {emoji} = mimeIcon(f.mime_type);
  return `<tr>
    <td><div class="file-td-name"><span class="file-td-icon">${emoji}</span>${esc(f.original_name)}</div></td>
    <td>${formatBytes(f.size_bytes)}</td>
    <td style="color:var(--text-muted)">${relativeDate(f.created_at)}</td>
    <td><div style="display:flex;gap:6px">
      <button class="action-btn dl" onclick="dlFile(${f.id},'${esc(f.original_name)}')" title="Download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div></td>
  </tr>`;
}

function dlFile(id, name) {
  const a = document.createElement('a');
  a.href = `https://api.camhost.space/files/${id}/download?token=${encodeURIComponent(getToken())}`;
  a.download = name; a.click();
}

function bindNewFolder() {
  document.getElementById('new-folder-btn').addEventListener('click', openNewFolderModal);
  document.getElementById('new-folder-cancel').addEventListener('click',()=>document.getElementById('new-folder-modal').classList.remove('open'));
  document.getElementById('new-folder-ok').addEventListener('click', createFolder);
  document.getElementById('new-folder-input').addEventListener('keydown',e=>{ if(e.key==='Enter') createFolder(); });

  document.getElementById('rename-cancel').addEventListener('click',()=>document.getElementById('rename-modal').classList.remove('open'));
  document.getElementById('rename-ok').addEventListener('click', doRename);
  document.getElementById('rename-input').addEventListener('keydown',e=>{ if(e.key==='Enter') doRename(); });
}

function openNewFolderModal() {
  document.getElementById('new-folder-input').value='';
  document.getElementById('new-folder-modal').classList.add('open');
  setTimeout(()=>document.getElementById('new-folder-input').focus(),100);
}

async function createFolder() {
  const name = document.getElementById('new-folder-input').value.trim();
  if(!name) return;
  try {
    await apiRequest('/folders',{method:'POST',body:{name}});
    document.getElementById('new-folder-modal').classList.remove('open');
    showToast('Folder created: '+name,'success');
    await loadFolders();
  } catch(e){ showToast('Error: '+e.message,'error'); }
}

function openRename(id, name) {
  renameFolderId = id;
  document.getElementById('rename-input').value = name;
  document.getElementById('rename-modal').classList.add('open');
  setTimeout(()=>document.getElementById('rename-input').focus(),100);
}

async function doRename() {
  const name = document.getElementById('rename-input').value.trim();
  if(!name||!renameFolderId) return;
  try {
    await apiRequest('/folders/'+renameFolderId,{method:'PUT',body:{name}});
    document.getElementById('rename-modal').classList.remove('open');
    showToast('Renamed to: '+name,'success');
    await loadFolders();
  } catch(e){ showToast('Error: '+e.message,'error'); }
}

function confirmDeleteFolder(id, name) {
  showConfirm('Delete "'+name+'"?','Files inside will be moved to your root files.',async()=>{
    try {
      await apiRequest('/folders/'+id,{method:'DELETE'});
      showToast('Folder deleted','success');
      await loadFolders();
    } catch(e){ showToast('Error: '+e.message,'error'); }
  });
}

init();
</script>
</body>
</html>
